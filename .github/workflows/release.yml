# =============================================================================
# GitHub Actions CI/CD Release Workflow
# Repository: https://github.com/AhBiYout-all/windows-disk-cleanup-builder
# Developer: AhBiYout (GitHub: AhBiYout-all)
# Official Blog: https://ahbiyoutvibe.blogspot.com/
# Affiliation: https://www.cisnet.co.kr
#
# 📌 Windows PC Desktop Installer Dedicated Workflow:
#  - Push(main/master) 및 Tag(v*) 또는 수동 실행(workflow_dispatch) 시 자동으로
#    Windows 단독 실행 파일(.exe)과 Inno Setup 정품 인스톨러(.exe)를 빌드하여
#    GitHub Releases 및 Actions Artifacts에 항상 100% 게시합니다.
# =============================================================================

name: Build & Package Windows Installer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Manual Release Version (e.g. v1.5.0)'
        required: false
        default: 'v1.5.0'

permissions:
  contents: write
  packages: write

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  # ===========================================================================
  # Single Unified Job: Build EXE, Compile Inno Setup, and Publish to Release
  # Windows 환경에서 빌드 후 즉시 GitHub Release를 발행하여 다운로드 분실 방지
  # ===========================================================================
  build-and-release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Python Dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 4. Build Standalone Portable EXE (PyInstaller)
        shell: pwsh
        run: |
          $iconParam = ""
          if (Test-Path "assets/app.ico") { $iconParam = "--icon=assets/app.ico" }
          elseif (Test-Path "app.ico") { $iconParam = "--icon=app.ico" }

          # (1) 단독 포터블 실행 파일 빌드
          pyinstaller --noconfirm --onefile --windowed `
            --name "DiskCleanupAuto_v1.5.0" `
            --uac-admin `
            $iconParam `
            --version-file "version_info.txt" `
            disk_cleanup_gui.py

          # (2) Inno Setup 언팩용 디렉터리 빌드
          pyinstaller --noconfirm --onedir --windowed `
            --name "DiskCleanupAuto" `
            --uac-admin `
            $iconParam `
            --version-file "version_info.txt" `
            disk_cleanup_gui.py

      - name: 5. Prepare Packaging Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/DiskCleanupAuto/assets"
          if (Test-Path "assets") { Copy-Item -Recurse -Force "assets/*" "dist/DiskCleanupAuto/assets" }
          if (Test-Path "register_scheduler.bat") { Copy-Item -Force "register_scheduler.bat" "dist/DiskCleanupAuto/" }
          if (Test-Path "dist/DiskCleanupAuto_v1.5.0.exe") {
            New-Item -ItemType Directory -Force -Path "Release"
            Copy-Item -Force "dist/DiskCleanupAuto_v1.5.0.exe" "Release/DiskCleanupAuto_v1.5.0.exe"
          }

      - name: 6. Install Inno Setup Compiler
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: 7. Compile Inno Setup Installer (.iss)
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $isccPath)) {
            $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($isccCmd) { $isccPath = $isccCmd.Source }
          }
          Write-Host "Using Inno Setup Compiler: $isccPath"

          New-Item -ItemType Directory -Force -Path "Output"
          & $isccPath installer.iss

      - name: 8. Consolidate Release Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts"
          # 설치 프로그램 복사
          Get-ChildItem -Path "Output" -Filter "*.exe" | ForEach-Object {
            Copy-Item -Force $_.FullName "release_artifacts/"
            Write-Host "Collected Installer: $($_.Name)"
          }
          # 단독 포터블 실행 파일 복사
          if (Test-Path "dist/DiskCleanupAuto_v1.5.0.exe") {
            Copy-Item -Force "dist/DiskCleanupAuto_v1.5.0.exe" "release_artifacts/"
            Write-Host "Collected Standalone Portable EXE: DiskCleanupAuto_v1.5.0.exe"
          }
          Write-Host "=== Final Artifacts List ==="
          Get-ChildItem -Path "release_artifacts"

      - name: 9. Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-v1.5.0
          path: release_artifacts/*
          retention-days: 30

      - name: 10. Determine Release Tag
        id: tag_info
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release_version }}"
          if (-not $tag -and "${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag) {
            $tag = "v1.5.0"
          }
          Write-Host "Resolved Target Tag: $tag"
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: 11. Publish to GitHub Releases (Both Setup & Standalone EXE)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.release_tag }}
          name: "Release ${{ steps.tag_info.outputs.release_tag }} - AhBiYout Windows Disk Cleanup Auto"
          body: |
            ## 🚀 ${{ steps.tag_info.outputs.release_tag }} 공식 Windows 바이너리 배포
            AhBiYout Windows 디스크 클린 오토(DiskCleanupAuto v1.5.0) 공식 릴리스입니다.

            ### 📦 배포 에셋 목록
            1. **`WindowsDiskCleanup_Setup_v1.5.0.exe`**: Inno Setup 개별 파일 언팩 설치 프로그램 (바탕화면/시작메뉴 바로가기, 방화벽 규칙 자동 등록, 제어판 등록)
            2. **`DiskCleanupAuto_v1.5.0.exe`**: 설치 없이 바로 실행 가능한 무설치 단독 실행 파일 (Portable Standalone)

            ---
            - **개발자**: AhBiYout (GitHub: [@AhBiYout-all](https://github.com/AhBiYout-all))
            - **공식 블로그**: [AhBiYoutVibe](https://ahbiyoutvibe.blogspot.com/)
            - **소속**: [CISNET](https://www.cisnet.co.kr)
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
